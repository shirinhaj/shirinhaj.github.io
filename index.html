<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shirin Hajahmadi | HCI Researcher</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f5f5f5;
      color: #333;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      background-color: #fff;
      border-bottom: 1px solid #ccc;
      padding: 20px 0;
    }

    .heading-block {
      margin-bottom: 10px;
    }

    h1 {
      font-size: 2rem;
      margin: 0;
    }

    .subtitle {
      font-size: 1.2rem;
      margin-top: 4px;
      color: #666;
    }

    nav ul {
      list-style: none;
      padding: 0;
      display: flex;
      gap: 20px;
      margin-top: 10px;
    }

    nav a {
      text-decoration: none;
      color: #0077cc;
    }

    nav a.active {
      font-weight: bold;
      border-bottom: 2px solid #0077cc;
    }

    main {
      background-color: #fff;
      padding: 30px;
      margin-top: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
    }

    .profile-photo {
      max-width: 180px;
      border-radius: 8px;
      float: right;
      margin-left: 20px;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.9em;
      color: #888;
    }

    footer a {
      color: #0077cc;
      text-decoration: none;
    }
  </style>
</head>
